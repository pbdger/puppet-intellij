name: build

on:
  push:
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.0.0'
      - name: Check project configuration
        run: gradle verifyPluginProjectConfiguration
      - name: Run tests
        run: gradle test
      - name: Build plugin
        run: gradle buildPlugin
      - name: Verify plugin structure
        run: gradle verifyPluginStructure
      - name: Verify compatibility with IntelliJ IDEA 2025
        run: gradle verifyPlugin
      - uses: actions/upload-artifact@v6
        with:
          name: puppet-intellij-plugin
          path: build/distributions/*.zip
